name: Pipeline CI e Docker

on:
  push:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  packages: write
jobs:
  validar-e-construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Verificar arquivo HTML
        run: test -f index.html

      - name: Verificar arquivo CSS
        run: test -f style.css
        
      - name: Preparar identificação da Imagem
        run: |
          IMAGE_ID="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_ID=$IMAGEM_ID" >> "$GITHUB_ENV"

      - name: Construir imagem Docker
        run: docker build -t "$IMAGE_ID:latest" .

      - name: Autenticar no GHCR
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
          env: GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR
        run: docker push "$IMAGE_ID:latest"
